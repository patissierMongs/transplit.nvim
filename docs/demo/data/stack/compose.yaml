services:
  proxy:
    image: nginx:1.27-alpine
    # Only the reverse proxy is reachable from outside; TLS is terminated here
    ports:
      - "443:443"
      - "127.0.0.1:8080:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks: [edge, backend]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://app@db:5432/app
    # Not published: only the proxy can reach it on the backend network
    expose:
      - "8000"
    depends_on:
      - db
    networks: [backend]

  db:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]

networks:
  edge:
  backend:
    internal: true

volumes:
  certs:
  pgdata:
